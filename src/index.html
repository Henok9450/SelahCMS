<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SelahCMS - Gerji Emmanuel United Church</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07514d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SelahCMS">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/logo2.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo2.png">
  <link rel="icon" type="image/png" href="assets/images/logo2.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/logo2.png">
  <!-- Ethiopic Font Support for Amharic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Container for Live Google Website Translator -->
  <div id="google_translate_element" style="display:none;" aria-hidden="true"></div>
  <app-root></app-root>

  <!-- Prevent Google Translate from translating Icons, User Names, Phones, and Entity Data -->
  <script>
    (function() {
      function protectDataAndIcons() {
        // 1. All icon elements
        var icons = document.querySelectorAll('mat-icon, .mat-icon, .material-icons, .material-icons-outlined');
        for (var i = 0; i < icons.length; i++) {
          if (!icons[i].classList.contains('notranslate')) {
            icons[i].classList.add('notranslate');
            icons[i].setAttribute('translate', 'no');
          }
        }

        // 2. All phone numbers, emails, and contact links
        var contacts = document.querySelectorAll('a[href^="tel:"], a[href^="mailto:"], .contact-link, .phone-link, .email-link, .phone-btn, .email-btn, .col-phone, .col-email');
        for (var j = 0; j < contacts.length; j++) {
          if (!contacts[j].classList.contains('notranslate')) {
            contacts[j].classList.add('notranslate');
            contacts[j].setAttribute('translate', 'no');
          }
        }

        // 3. User names, avatar initials, codes, IDs, and timestamps
        var dataElements = document.querySelectorAll('.user-name-title, .user-avatar-badge, .card-avatar, .member-avatar, .code-badge, .header-time, .header-date, .study-time, .col-name, .member-name, .member-title, input, textarea');
        for (var k = 0; k < dataElements.length; k++) {
          if (!dataElements[k].classList.contains('notranslate')) {
            dataElements[k].classList.add('notranslate');
            dataElements[k].setAttribute('translate', 'no');
          }
        }
      }

      var observer = new MutationObserver(protectDataAndIcons);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', protectDataAndIcons);
    })();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(registration) {
            console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] ServiceWorker registration skipped:', err);
          });
      });
    }
  </script>
</body>
</html>
