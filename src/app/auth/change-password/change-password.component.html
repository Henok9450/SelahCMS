<mat-card class="change-password-card">
    <mat-card-header>
      <mat-card-title>Change Password</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="changePassword()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Current Password</mat-label>
          <input matInput 
                 [type]="hideCurrentPassword ? 'password' : 'text'" 
                 [(ngModel)]="currentPassword" 
                 name="currentPassword" 
                 autocomplete="current-password"
                 required>
          <button mat-icon-button 
                  matSuffix 
                  type="button"
                  (click)="hideCurrentPassword = !hideCurrentPassword" 
                  [attr.aria-label]="hideCurrentPassword ? 'Show current password' : 'Hide current password'"
                  [matTooltip]="hideCurrentPassword ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput 
                 [type]="hideNewPassword ? 'password' : 'text'" 
                 [(ngModel)]="newPassword" 
                 name="newPassword" 
                 autocomplete="new-password"
                 required>
          <button mat-icon-button 
                  matSuffix 
                  type="button"
                  (click)="hideNewPassword = !hideNewPassword" 
                  [attr.aria-label]="hideNewPassword ? 'Show new password' : 'Hide new password'"
                  [matTooltip]="hideNewPassword ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm New Password</mat-label>
          <input matInput 
                 [type]="hideConfirmPassword ? 'password' : 'text'" 
                 [(ngModel)]="confirmPassword" 
                 name="confirmPassword" 
                 autocomplete="new-password"
                 required>
          <button mat-icon-button 
                  matSuffix 
                  type="button"
                  (click)="hideConfirmPassword = !hideConfirmPassword" 
                  [attr.aria-label]="hideConfirmPassword ? 'Show confirm password' : 'Hide confirm password'"
                  [matTooltip]="hideConfirmPassword ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
  
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
  
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>
  
        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Change Password</span>
          <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
