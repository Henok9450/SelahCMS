<form [formGroup]="filterForm" class="filter-container">
    <div class="filter-row">
      <!-- Status Filter -->
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let status of statusOptions" [value]="status.value">
            {{ status.display }}
          </mat-option>
        </mat-select>
      </mat-form-field>
  
      <!-- Role Filter -->
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let role of roleOptions" [value]="role.value">
            {{ role.display }}
          </mat-option>
        </mat-select>
      </mat-form-field>
  
      <!-- Hiyaw Mahider Filter -->
      <mat-form-field appearance="outline">
        <mat-label>Hiyaw Mahider</mat-label>
        <mat-select formControlName="hiyawMahiderId">
          <mat-option value="">All Hiyaw Mahiders</mat-option>
          <mat-option *ngFor="let mahider of hiyawMahiders$ | async" [value]="mahider.id">
            {{ mahider.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  
    <div class="filter-row">
      <!-- Date Range -->
      <mat-form-field appearance="outline">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>
  
      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>
  
    <div class="action-buttons">
      <button mat-raised-button color="primary" (click)="applyFilters()">Apply Filters</button>
      <button mat-raised-button color="warn" (click)="resetFilters()">Reset</button>
    </div>
  </form>
