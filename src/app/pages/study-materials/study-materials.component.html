<div class="container">
  <div class="header">
    <h1>Study Materials</h1>
    <button *ngIf="isAdmin$ | async" mat-raised-button color="primary" (click)="openUploadDialog()">
      <mat-icon>upload</mat-icon> Upload New Material
    </button>
  </div>

  <!-- Skeleton Shimmer Loading State -->
  <div *ngIf="loading" class="skeleton-grid" style="margin-bottom: 1.5rem;">
    <div class="skeleton-card" *ngFor="let c of [1,2,3]">
      <div style="display: flex; gap: 1rem; align-items: center;">
        <div class="skeleton-shimmer skeleton-avatar" style="border-radius: 8px;"></div>
        <div style="flex: 1;">
          <div class="skeleton-shimmer skeleton-title" style="width: 60%; height: 18px; margin-bottom: 4px;"></div>
          <div class="skeleton-shimmer skeleton-text" style="width: 40%; height: 12px;"></div>
        </div>
      </div>
      <div class="skeleton-shimmer skeleton-text" style="width: 90%; margin-top: 0.5rem;"></div>
      <div class="skeleton-shimmer skeleton-text" style="width: 70%;"></div>
      <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
        <div class="skeleton-shimmer skeleton-badge" style="width: 90px; height: 32px;"></div>
      </div>
    </div>
  </div>

  <div class="materials-grid">
    <mat-card *ngFor="let material of materials$ | async" class="material-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>{{ getFileIcon(material.fileType) }}</mat-icon>
        <mat-card-title>{{ material.title }}</mat-card-title>
        <mat-card-subtitle>{{ material.fileType }} • {{ material.uploadDate | date }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ material.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <a mat-button color="primary" [href]="material.fileUrl" target="_blank" download>
          <mat-icon>cloud_download</mat-icon> Download
        </a>
        <button *ngIf="isAdmin$ | async" mat-button color="warn" (click)="deleteMaterial(material.id!, material.fileUrl)">
          <mat-icon>delete</mat-icon> Delete
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="(materials$ | async)?.length === 0 && !loading" class="empty-state">
    <mat-icon class="empty-icon">folder_open</mat-icon>
    <h3>No study materials yet</h3>
    <p *ngIf="isAdmin$ | async">Upload your first study material by clicking the button above</p>
    </div>
</div>
