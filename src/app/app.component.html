<header class="dashboard-header" *ngIf="showHeaderAndSidebar">
  <button class="mobile-menu-toggle" (click)="toggleMobileMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="header-content">
    <div class="logo-section">
      <a href="#" class="logo"></a>
      <h1>SelahCMS</h1>
    </div>
    <div class="user-info">
      <div *ngIf="authService.authState$ | async as user; else loginButton" class="user-greeting">
        <span>Welcome, {{ user.fullName || user.displayName || user.email || 'User' }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
      <ng-template #loginButton>
        <button mat-button routerLink="/login">
          <mat-icon>login</mat-icon>
          Login
        </button>
      </ng-template>

      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User account menu">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="changePassword()">
          <mat-icon>lock</mat-icon>
          <span>Change Password</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>

<div class="main-layout-wrapper" [class.no-sidebar-layout]="!showHeaderAndSidebar">
  <app-sidebar *ngIf="showHeaderAndSidebar" [isMobileMenuOpen]="isMobileMenuOpen" (navLinkClicked)="closeMobileMenu()"></app-sidebar>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>

<footer *ngIf="showFooter" class="footer">
  <p>© {{currentYear}} SelahCMS v{{ appVersion }} </p>
  <p>GoodNews Innovations, All rights reserved.</p>
</footer>

<div class="overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
